[project]
name = "sparring"
version = "0.1.0"
description = "Sparring backend: job offer and CV analysis, interview plan, scoring and report."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "elevenlabs>=2.79.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "websockets>=17.4",
]
# Microphone/speaker for scripts/voice_interview.py only. Not in `dev` because pyaudio
# compiles against PortAudio (`brew install portaudio`), which CI runners do not have.
voice = [
    "pyaudio>=0.2.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is allowed in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
# The ElevenLabs SDK leaves some functions untyped (start_session, DefaultAudioInterface...).
# Only this development script calls them.
module = "scripts.voice_interview"
disallow_untyped_calls = false

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live'"
markers = [
    "live: calls real APIs (DeepSeek, ElevenLabs...). Requires keys and costs money.",
]
